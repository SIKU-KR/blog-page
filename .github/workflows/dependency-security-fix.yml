name: Dependency security fix

on:
  schedule:
    - cron: '0 1 * * 1' # 매주 월요일 10:00 KST
  workflow_dispatch:

concurrency:
  group: dependency-security-fix

env:
  PR_BRANCH: deps/security-auto

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write # Keep unresolved advisories visible without duplicate issue comments.
      actions: write # GITHUB_TOKEN pushes do not trigger CI; dispatch it explicitly.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      # Exit 1 may mean vulnerabilities remain. The parser also rejects registry errors.
      - name: Audit before fixes
        run: |
          npm audit --json > "$RUNNER_TEMP/audit-before.json" || test "$?" -eq 1
          node .github/scripts/dependency-audit.mjs "$RUNNER_TEMP/audit-before.json" > "$RUNNER_TEMP/audit-before.md"

      - name: Apply compatible security updates
        run: |
          npm audit fix --ignore-scripts --no-fund --json > "$RUNNER_TEMP/audit-fix.json" || test "$?" -eq 1
          node -e 'const r = require(process.argv[1]); if (r.error || !r.audit?.metadata?.vulnerabilities) throw new Error("npm audit fix failed; inspect audit-fix.json")' "$RUNNER_TEMP/audit-fix.json"

      - name: Report remaining vulnerabilities
        run: |
          npm audit --json > "$RUNNER_TEMP/audit-after.json" || test "$?" -eq 1
          node .github/scripts/dependency-audit.mjs "$RUNNER_TEMP/audit-after.json" > "$RUNNER_TEMP/audit-after.md"
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit-production.json" || test "$?" -eq 1
          node .github/scripts/dependency-audit.mjs "$RUNNER_TEMP/audit-production.json" > "$RUNNER_TEMP/audit-production.md"
          cat "$RUNNER_TEMP/audit-after.md" >> "$GITHUB_STEP_SUMMARY"
          echo '### Production dependencies' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/audit-production.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Track unresolved advisories
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const marker = '<!-- dependency-security-unresolved -->';
            const report = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'audit-after.json'), 'utf8'));
            const issues = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', per_page: 100 });
            const existing = issues.find(issue => !issue.pull_request && issue.body?.startsWith(marker));
            if (report.metadata.vulnerabilities.total === 0) {
              if (existing) await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'closed' });
              return;
            }
            const full = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'audit-after.md'), 'utf8');
            const production = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'audit-production.md'), 'utf8');
            const body = [marker, 'Remaining after compatible fixes. Upstream patches or a reviewed migration are required; this is not an audit exemption.', '', full, '## Production dependencies', production, '', '[Latest maintenance run](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')', '', 'See docs/dependency-security.md for remediation context.'].join('\n');
            if (existing) {
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title: '[security] Remaining npm advisories', body });
            }

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-audit
          path: ${{ runner.temp }}/audit-*
          if-no-files-found: error

      - name: Detect dependency changes
        id: changes
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Load placeholder build env
        if: steps.changes.outputs.changed == 'true'
        run: grep -v '^#' .github/ci.env >> "$GITHUB_ENV"

      - name: Verify updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm run format:check
          npm run lint
          npm test
          node --test .github/scripts/*.test.mjs
          npm run test:coverage
          npm run build

      - name: Prepare PR report
        if: steps.changes.outputs.changed == 'true'
        run: |
          {
            echo 'Compatible updates from npm audit fix; no --force, major migrations, or AI credentials.'
            echo 'Formatting, lint, tests, coverage, and production build passed before this PR was created.'
            echo 'CI is also explicitly dispatched for this branch; auto-merge requires the checks status.'
            echo
            echo '## Before fixes'
            cat "$RUNNER_TEMP/audit-before.md"
            echo '## After fixes'
            cat "$RUNNER_TEMP/audit-after.md"
            echo '## Production dependencies'
            cat "$RUNNER_TEMP/audit-production.md"
          } > "$RUNNER_TEMP/security-pr.md"

      - name: Create or update security PR
        if: steps.changes.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: ${{ env.PR_BRANCH }}
          commit-message: 'chore: resolve compatible npm audit vulnerabilities'
          title: 'chore: resolve compatible npm audit vulnerabilities'
          body-path: ${{ runner.temp }}/security-pr.md
          add-paths: |
            package.json
            package-lock.json

      - name: Dispatch CI and consider auto-merge
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          gh workflow run ci.yml --ref "$PR_BRANCH"
          base_branch=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)
          git fetch --no-tags origin "$base_branch" "$PR_BRANCH"
          node .github/scripts/dependency-automerge.mjs "$PR_URL" "origin/$base_branch" "origin/$PR_BRANCH"
